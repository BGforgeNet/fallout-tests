name: "Integration"

# The integration suite validates against a pinned checkout of real Fallout modding data. The pin means the
# result can only change when this repository's code changes, so it runs on push/PR like every other gate
# rather than on a timer. The checkout is cached on the pinned commit, so the clone is a one-time cost.
on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Cache the pinned data checkout
        # conftest.py holds the pinned commit, so keying on its hash re-clones exactly when the pin moves.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/Fallout2_Unofficial_Patch
          key: fallout-data-${{ hashFiles('tests/conftest.py') }}

      - name: Test
        run: uv run pytest -m integration tests/ -v --tb=short
