name: "Lint"

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Ruff
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: ty
        run: uv run ty check

      - name: Test
        run: uv run pytest -m "not integration" tests/ -v --tb=short --cov=scripts --cov-fail-under=94

  action:
    # Exercises action.yml itself - the INPUT_* bindings and the GITHUB_ACTION_PATH invocation - which the
    # unit tests cannot reach because they call the validators directly.
    name: action self-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the action against the checked-in fixtures
        uses: $/
        with:
          scripts_h: tests/fixtures/scripts.h
          scripts_lst: tests/fixtures/scripts.lst
          scripts_dir: tests/fixtures
          dialog_dir: tests/fixtures
          city_path: tests/fixtures/city.txt
          maps_path: tests/fixtures/maps.txt
          worldmap_path: tests/fixtures/worldmap.txt
          worldmap_script_sets: "2 3"
          quests_path: tests/fixtures/quests.txt
          game_msg_dir: tests/fixtures
          map_gam_dir: tests/fixtures/maps
