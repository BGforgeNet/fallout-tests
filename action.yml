name: Fallout tests
description: Check Fallout script data and messages for validity
branding:
  icon: message-circle
  color: green

inputs:
  scripts_h:
    description: scripts.h path
    required: false
    default: scripts_src/headers/scripts.h
  scripts_lst:
    description: scripts.lst path
    default: data/scripts/scripts.lst
    required: false
  scripts_dir:
    description: scripts directory
    required: false
    default: scripts_src
  dialog_dir:
    description: text/english/dialog path
    default: data/text/english/dialog
    required: false
  check_scripts:
    description: check scripts.h and scripts.lst
    default: "true"
    required: false
  check_lvars:
    description: check LVARs vs scripts.lst, and reaction LVAR indices 0-3
    default: "true"
    required: false
  check_msgs:
    description: check msg references in scripts
    default: "true"
    required: false
  city_path:
    description: city.txt path; if set, run city tests. Empty or false skips them
    default: ""
    required: false
  maps_path:
    description: maps.txt path; if set, run maps tests. Empty or false skips them
    default: ""
    required: false
  worldmap_path:
    description: worldmap.txt path; if set, run worldmap tests. Empty or false skips them
    default: ""
    required: false
  worldmap_script_sets:
    description: "allowed script sets, one space-separated set per line"
    default: ""
    required: false
  quests_path:
    description: quests.txt path; if set, run quests tests. Empty or false skips them
    default: ""
    required: false
  game_msg_dir:
    description: text/english/game path, holding quests.msg and map.msg
    default: data/text/english/game
    required: false
  map_gam_dir:
    description: maps directory holding map .gam files; if set, run map variable tests. Empty or false skips them
    default: ""
    required: false

runs:
  using: "composite"
  steps:
    - name: Test
      shell: bash
      run: python3 ${GITHUB_ACTION_PATH}/scripts/action.py
      # Composite actions do not receive INPUT_* environment variables automatically - only docker and
      # JavaScript actions do - so these mappings are required, not boilerplate. Without them action.py
      # reads nothing and every check silently passes against its defaults. Passing values through env
      # rather than as arguments also keeps workflow input out of the shell command line.
      env:
        INPUT_SCRIPTS_H: ${{ inputs.scripts_h }}
        INPUT_SCRIPTS_LST: ${{ inputs.scripts_lst }}
        INPUT_SCRIPTS_DIR: ${{ inputs.scripts_dir }}
        INPUT_DIALOG_DIR: ${{ inputs.dialog_dir }}
        INPUT_CHECK_SCRIPTS: ${{ inputs.check_scripts }}
        INPUT_CHECK_LVARS: ${{ inputs.check_lvars }}
        INPUT_CHECK_MSGS: ${{ inputs.check_msgs }}
        INPUT_CITY_PATH: ${{ inputs.city_path }}
        INPUT_MAPS_PATH: ${{ inputs.maps_path }}
        INPUT_WORLDMAP_PATH: ${{ inputs.worldmap_path }}
        INPUT_WORLDMAP_SCRIPT_SETS: ${{ inputs.worldmap_script_sets }}
        INPUT_QUESTS_PATH: ${{ inputs.quests_path }}
        INPUT_GAME_MSG_DIR: ${{ inputs.game_msg_dir }}
        INPUT_MAP_GAM_DIR: ${{ inputs.map_gam_dir }}
